services:
  app:
    build:
      context: .
    image: egeadcompanywebsite_app
    container_name: egead_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DATABASE_URL: "${DATABASE_URL:-mysql://${MYSQL_USER:-egead}:${MYSQL_PASSWORD:-change-me}@db:3306/${MYSQL_DATABASE:-egead}}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-change-this-to-a-long-random-secret-at-least-32-chars}"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-http://localhost:${APP_PORT:-8080}}"
      NEXT_PUBLIC_BETTER_AUTH_URL: "${NEXT_PUBLIC_BETTER_AUTH_URL:-http://localhost:${APP_PORT:-8080}}"
      CLOUDINARY_CLOUD_NAME: "${CLOUDINARY_CLOUD_NAME:-}"
      CLOUDINARY_API_KEY: "${CLOUDINARY_API_KEY:-}"
      CLOUDINARY_API_SECRET: "${CLOUDINARY_API_SECRET:-}"
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: "${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME:-}"
    networks:
      - website
      - proxy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  db:
    image: mysql:8.4
    container_name: egead_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-egead}"
      MYSQL_USER: "${MYSQL_USER:-egead}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-change-me}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-change-root-password}"
    command:
      [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
      ]
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - website
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:

networks:
  website:
    name: egead_website
    driver: bridge
  proxy:
    external: true
    name: egeadcompanywebsite_default
